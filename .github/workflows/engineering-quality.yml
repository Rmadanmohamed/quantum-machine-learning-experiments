name: Engineering quality
on:
  pull_request:
  push:
    branches: ['audit/phase2-dependencies']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -c "import qiskit, qiskit_algorithms, qiskit_machine_learning, pylatexenc; from qiskit.primitives import StatevectorEstimator, StatevectorSampler; from qiskit_machine_learning.kernels import FidelityQuantumKernel, TrainableFidelityQuantumKernel; from qiskit_machine_learning.state_fidelities import ComputeUncompute"
